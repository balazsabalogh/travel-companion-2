<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2034">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Companion">
<meta name="format-detection" content="telephone=no">
<title>Travel Companion · Antalya</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./app.css?v=080-beta1">
</head>
<body class="theme-dark">
<div id="app">
  <div id="map"></div>
  <div id="offlineMap" class="offline-map" aria-hidden="true"></div>

  <div class="notification-zone">
    <button id="notifStrip" class="notif-strip hidden" aria-label="Értesítések lehúzása">
      <span class="notif-dot"></span><span class="notif-copy"><b id="notifStripTitle"></b><small id="notifStripText"></small></span><span class="chev">⌄</span>
    </button>
    <section id="notifDrawer" class="notif-drawer">
      <div class="drawer-head"><div><b>Értesítések</b><small id="notifCountText"></small></div><button id="notifClose" class="iconbtn">⌃</button></div>
      <div id="notifList" class="notif-list"></div>
    </section>
  </div>

  <div id="mapControls" class="map-controls">
    <button id="locateBtn" class="map-btn" title="Saját pozíció">◎</button>
    <button id="fitRouteBtn" class="map-btn" title="Útvonal középre">⌖</button>
  </div>

  <div id="sonarPulse" class="sonar-pulse"><i></i><i></i><i></i></div>
  <div id="sonarStatus" class="sonar-status">PING</div>

  <section id="sheet" class="sheet state-closed" aria-live="polite">
    <div id="sheetDrag" class="sheet-drag"><span></span></div>
    <div id="sheetBody" class="sheet-body"></div>
    <nav id="expandedNav" class="expanded-nav hidden"></nav>
  </section>

  <nav id="mainNav" class="main-nav">
    <button class="main-tab" data-main="itinerary" id="mainItinerary" aria-label="Útiterv"><span class="ico">⌁</span><b>Útiterv</b></button>
    <button class="main-tab" data-main="days" id="mainDays" aria-label="Napok"><span class="ico">▦</span><b>Napok</b></button>
    <button class="main-tab" data-main="favorites" id="mainFavorites" aria-label="Kedvencek"><span class="ico">♡</span><b>Kedvencek</b></button>
    <div class="logo-gap" aria-hidden="true"></div>
    <button class="main-tab" data-main="settings" id="mainSettings" aria-label="Beállítások"><span class="ico">⚙</span><b>Beállítások</b></button>
    <button class="main-tab main-notif" data-main="notifications" id="mainNotifications" aria-label="Értesítések"><span class="ico">♢</span><span id="mainNotifBadge" class="main-notif-badge hidden">0</span><b>Értesítések</b></button>
    <button class="main-tab" data-main="navigation" id="mainNavigation" aria-label="Navigáció"><span class="ico">➤</span><b>Navigáció</b></button>
  </nav>
  <button id="companionLogo" class="companion-logo" aria-label="Travel Companion"><img src="./assets/logo-tr.png" alt=""><span id="logoBadge" class="logo-badge hidden">0</span></button>

  <div id="toast" class="toast"></div>
  <div id="holdMenu" class="hold-menu hidden"></div>

  <nav id="overlayNav" class="overlay-nav hidden"></nav>

  <section id="fullOverlay" class="full-overlay hidden">
    <div class="overlay-head"><button id="overlayBack" class="iconbtn">‹</button><div><b id="overlayTitle"></b><small id="overlaySubtitle"></small></div><button id="overlayClose" class="iconbtn">×</button></div>
    <div id="overlayBody" class="overlay-body"></div>
  </section>

  <section id="coachOverlay" class="coach-overlay hidden" aria-live="polite"></section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./app.js?v=080-beta1"></script>
</body>
</html>
